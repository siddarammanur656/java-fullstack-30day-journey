# Production settings
server.port=8080

# Real PostgreSQL database
spring.datasource.url=jdbc:postgresql://localhost:5432/taskmanager_prod
spring.datasource.username=${DB_USERNAME}   # from environment variable
spring.datasource.password=${DB_PASSWORD}   # from environment variable

# Never drop production tables!
spring.jpa.hibernate.ddl-auto=validate

# Don't show SQL in production logs
spring.jpa.show-sql=false

# Only show warnings in production
logging.level.com.learning.taskmanager=WARN