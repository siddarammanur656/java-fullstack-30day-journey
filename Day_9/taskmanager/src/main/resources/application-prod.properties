# Production settings
server.port=8080

# Real PostgreSQL database
spring.datasource.url=jdbc:postgresql://localhost:5432/taskmanager_prod
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Never drop production tables — Flyway manages schema
spring.jpa.hibernate.ddl-auto=validate

# Don't show SQL in production logs
spring.jpa.show-sql=false

# Flyway settings
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Only show warnings in production
logging.level.com.learning.taskmanager=WARN